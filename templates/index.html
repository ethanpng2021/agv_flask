<!DOCTYPE html>
<html lang="en">
<head>
	<title>AGV Production Floor</title>

	<!-- Latest compiled and minified JavaScript -->
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>

	<link rel="preconnect" href="https://fonts.gstatic.com">

	<style>
		#time {
			font-family: 'Montserrat', sans-serif;
		}
		.p1 {
			font-family: 'Montserrat', sans-serif;
		}
		#containerbox {
		    padding-left: 0;
    		padding-right: 0;
    		margin-left: auto;
    		margin-right: auto;
    		display: block;
    		width: 1620px;
		}
	</style>
</head>
<body>
	<div id="containerbox">
		<h3 class="p1">AGV Production Floor</h3>
		<div class="btn-group"> 
			<a href="{{ url_for('home') }}" class="btn btn-danger" role="button">Home</a>
			<a href="{{ url_for('uploadfloorplan') }}" class="btn btn-success" role="button">Upload Factory Floor Plan</a>
		</div>
		<br>
		<br>
		<p class="p1">
			Elapsed Time: <b><span id="time"></span></b> milliseconds
		</p>
		<canvas id="map"></canvas>
    </div>
		<script>
			var mapObj = [];
			var mapX = 80;
			var mapY = 40;
			var tileSize = 20;
			var prob = 0.2;

			var player = {
				x: 6,
				y: 4
			};
			var path = [];

			var canvas = document.getElementById("map");
			var ctx = canvas.getContext("2d");

			var mapo = [];
			mapo = {{intins|safe}}

			var initMapObj = function() {
				$("#map").attr("height", mapY * tileSize);
				$("#map").attr("width", mapX * tileSize);
				for (var y = 0; y < mapY; y++) {
					mapObj[y] = [];
					for (var x = 0; x < mapX; x++) {
                    //var b = Math.random() < prob;
                    var b = mapo[y][x]
                    mapObj[y][x] = {
                    	block: b
                    };
                }
            }


            mapObj[0][0].block = false;
        };
        
        var draw = function() {
        	ctx.fillStyle = "#FFFFFF";
        	ctx.fillRect(0, 0, mapX * tileSize, mapY * tileSize);
        	for (var y = 0; y < mapY; y++) {
        		for (var x = 0; x < mapX; x++) {
        			if (mapObj[y][x].block) {
        				ctx.fillStyle = "#000000";
        				ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
        			} else {
        				ctx.strokeStyle = "#000000";
        				ctx.lineWidth = 2;
        				ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
        			}
        		}
        	}

    // Player
    ctx.fillStyle = "#0000FF";
    ctx.fillRect(player.x * tileSize, player.y * tileSize, tileSize, tileSize);

    // Path
    for (var i in path) {
    	ctx.fillStyle = "#FF0000";
    	ctx.fillRect(path[i].x * tileSize, path[i].y * tileSize, tileSize, tileSize);
    }
};

$("#map").click(function(e) {
	var offset = $(this).offset();
	x = e.pageX - offset.left;
	y = e.pageY - offset.top;

	x = (x - (x % tileSize)) / tileSize;
	y = (y - (y % tileSize)) / tileSize;

	var m = {};
	$.extend(true, m, mapObj);

	var start = new Date().getTime();
	path = findPath(player.x, player.y, x, y, m, {
		x: mapX,
		y: mapY
	});

	var time = new Date().getTime() - start;
	$("#time").text(time);
	draw();
});

/* ----------- PathFinder -----------------*/
var lookInArray = function(array, obj, compareFunction) {
	for (var i in array) {
		if (compareFunction(array[i], obj)) {
			return i;
		}
	}
};

var compareNode = function(o1, o2) {
	return o1.x == o2.x && o1.y == o2.y;
};

var calcH = function(from, to) {
	var returnValue = Math.abs(from.x - to.x) + Math.abs(from.y - to.y);
	return returnValue;
};

var pushInSortedArray = function(array, o, attr) {
	array.unshift(o);
	array.sort(function(o1, o2) {
		return o1[attr] - o2[attr];
	});
	return array;
};

var findPath = function(sX, sY, dX, dY, map, mapSize) {

	var steps = [];
	var i = 0;

	var actualStep = {
		x: sX,
		y: sY
	};
	var lastStep = {
		x: dX,
		y: dY
	};

	var open = [];
	var closed = [];

	var h = calcH(actualStep, lastStep);
	var first = {
		x: actualStep.x,
		y: actualStep.y,
		g: -1,
		h: -1,
		cost: -1,
		parent: -1
	};
	open.push(first);

	while (true) {

		var verify = [];

		var bestNode = open[0];

		actualStep.x = bestNode.x;
		actualStep.y = bestNode.y;

		open.splice(0, 1);
		closed.push(bestNode);

		if (actualStep.x == lastStep.x && actualStep.y == lastStep.y) {
			var n = closed[closed.length - 1];
			var path = [];
			while(n.parent != -1) {
				path.unshift(n);
				n = closed[n.parent];
			}
			return path;
		}

        // Direita
        if (actualStep.x + 1 < mapSize.x) {
        	var o = {
        		x: actualStep.x + 1,
        		y: actualStep.y
        	};
        	if (!map[o.y][o.x].block) {
        		verify.push(o);
        	}
        }

        // Esquerda
        if (actualStep.x - 1 >= 0) {
        	var o = {
        		x: actualStep.x - 1,
        		y: actualStep.y
        	};
        	if (!map[o.y][o.x].block) {
        		verify.push(o);
        	}
        }

        // Acima
        if (actualStep.y - 1 >= 0) {
        	var o = {
        		x: actualStep.x,
        		y: actualStep.y - 1
        	};
        	if (!map[o.y][o.x].block) {
        		verify.push(o);
        	}
        }

        // Abaixo
        if (actualStep.y + 1 < mapSize.y) {
        	var o = {
        		x: actualStep.x,
        		y: actualStep.y + 1
        	};
        	if (!map[o.y][o.x].block) {
        		verify.push(o);
        	}
        }

        for (var i in verify) {
        	if (lookInArray(closed, verify[i], compareNode)) {
        		continue;
        	}

        	if (!lookInArray(open, verify[i], compareNode)) {
        		var g = bestNode.g + calcH(verify[i], bestNode);
        		var h = calcH(verify[i], lastStep);
        		var n = {
        			x: verify[i].x,
        			y: verify[i].y,
        			g: g,
        			h: h,
        			cost: g + h,
        			parent: closed.length - 1
        		};
        		open = pushInSortedArray(open, n, "cost");
        	}
        }
    }
};

initMapObj();
draw();
</script>



</body>
</html>
