<!DOCTYPE html>
<html lang="en">
<head>
	<title>AGV Production Floor Map Upload Test</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

	<link rel="stylesheet" href="//code.jquery.com/ui/1.11.4/themes/smoothness/jquery-ui.css">

	<script src="//code.jquery.com/ui/1.11.4/jquery-ui.js"></script>

	<!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

	<!-- Optional theme -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">

	<!-- Latest compiled and minified JavaScript -->
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
	<style>
		#time {
			font-family: 'Montserrat', sans-serif;
		}
		.p1 {
			font-family: 'Montserrat', sans-serif;
		}
		#containerbox {
		    padding-left: 0;
    		padding-right: 0;
    		margin-left: auto;
    		margin-right: auto;
    		display: block;
    		width: 1620px;
		}
	</style>
</head>
<body>
	<div id="containerbox">
		<h3 class="p1">AGV Production Floor Map Upload Test</h3>
		<div class="btn-group"> 
			<a href="{{ url_for('home') }}" class="btn btn-danger" role="button">Home</a>
			<a href="{{ url_for('uploadfloorplan') }}" class="btn btn-success" role="button">Upload Factory Floor Plan</a>
			<a href="" class="btn btn-primary" role="button">Edit Floor Plan</a>
			<a href="" class="btn btn-info" role="button">Specify Loading and Unloading Bays</a>
		</div>
		<br>
		<br>
		<br>
		<br>

		<form action="/processfloorplan" method="post" enctype="multipart/form-data">
	        
	        <div class="form-group row">
	        
	          <!-- <div class="col-xs-4">
	            <label class="mdb-main-label" for="floorplanname">Floor Plan Name</label>
	            <input type="text" id="floorplanname" class="form-control" name="floorplanname">
	          </div> -->      
	                
	          <div class="col-xs-4">
	            <div class="custom-file">
	              <label class="custom-file-label" for="floorplanfile">Upload Floor Plan File (*.png, *.jpg)</label>
	              <input type="file" class="custom-file-input" name="floorplanfile">
	            </div>
	          </div>
	          
	        </div>

	        <br><br><br>
	        
	        <div class="mt-3">
	          <button type="submit" class="btn btn-primary">Submit</button>
	        </div>
        </form>
	
	
    </div>

<div>
{% with messages = get_flashed_messages() %}
  {% if messages %}
        {% for message in messages %}
            {{ message }}
        {% endfor %}
  {% endif %}
{% endwith %}
</div>

</body>
</html>
